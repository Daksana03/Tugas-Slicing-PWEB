<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Launcher - Single Sign On - Universitas Jember</title>
    <link rel="icon" type="image/png" href="Logo UNEJ.png">
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="background"></div>
    <div class="overlay"></div>

    <main class="main-container">

        <!-- LOGO UNEJ -->
        <div class="unej-logo">
            <img src="Asset/Logo UNEJ.png" alt="unej-logo">
        </div>

        <!-- MENU -->
        <section class="menu-grid">

            <a href="https://siakad.unej.ac.id/" class="menu-card merah">
                <div class="icon"><img src="https://cdn-icons-png.flaticon.com/128/15748/15748362.png" alt="SIAKAD">
                </div>
                <span>SIAKAD</span>
            </a>

            <a href="https://mmp.unej.ac.id/login/index.php" class="menu-card merah">
                <div class="icon"><img src="https://th.bing.com/th/id/OIP.iOIV3gTybUf4PJAV61KNGgAAAA?w=176&h=176&c=7&r=0&o=7&dpr=1.3&pid=1.7&rm=3" alt="MMP"></div>
                <span>MMP</span>
            </a>

            <a href="https://kawanda.unej.ac.id/index.php/login" class="menu-card merah">
                <div class="icon"><img src="https://cdn-icons-png.flaticon.com/128/4380/4380600.png" alt="KAWANDA"></div>
                <span>KAWANDA</span>
            </a>

            <a href="https://unej-id.zoom.us/" class="menu-card orange">
                <div class="icon"><img src="https://cdn-icons-png.flaticon.com/128/15789/15789391.png" alt="ZOOM"></div>
                <span>ZOOM</span>
            </a>

            <a href="https://sister.unej.ac.id/epayment/daftartagihan" class="menu-card ungu">
                <div class="icon"><img src="https://cdn-icons-png.flaticon.com/128/726/726488.png" alt="E-PAYMENT"></div>
                <span>E-PAYMENT</span>
            </a>

            <a href="https://sister.unej.ac.id/home/qrcodelogin" class="menu-card ungu">
                <div class="icon"><img src="https://cdn-icons-png.flaticon.com/128/326/326951.png" alt="LOGIN SFS"></div>
                <span>LOGIN SFS</span>
            </a>

            <a href="https://siska.unej.ac.id/" class="menu-card pink">
                <div class="icon"><img src="https://cdn-icons-png.flaticon.com/128/11210/11210085.png" alt="SISKA"></div>
                <span>SISKA</span>
            </a>

            <a href="https://uc3.unej.ac.id/" class="menu-card hijau">
                <div class="icon"><img src="https://cdn-icons-png.flaticon.com/128/2706/2706950.png" alt="UC3"></div>
                <span>UC3</span>
            </a>

            <a href="https://vpnuser.unej.ac.id/" class="menu-card kuning">
                <div class="icon"><img src="https://cdn-icons-png.flaticon.com/128/17349/17349599.png" alt="VPN"></div>
                <span>VPN</span>
            </a>

            <a href="https://library.unej.ac.id/" class="menu-card kuning">
                <div class="icon"><img src="https://cdn-icons-png.flaticon.com/128/2997/2997608.png" alt="LIBRARY"></div>
                <span>LIBRARY</span>
            </a>

        </section>

        <!-- FOOTER -->
        <div class="footer-links">
            <a href="https://www.youtube.com/c/UPTTeknologiInformasiUniversitasJember/about"><img src="https://cdn-icons-png.flaticon.com/128/1384/1384060.png" alt="Youtube"> Youtube UPT TIK Universitas Jember</a>
            <a href="https://upttik.unej.ac.id/"><img src="https://cdn-icons-png.flaticon.com/128/841/841364.png" alt="Web"> Website UPT TIK Universitas Jember</a>
        </div>

    </main>

    <!-- PROFILE SIDEBAR -->
    <aside class="profile">

        <div class="profile-header">
            <h3>Profil</h3>
            <div class="profile-actions">
            </div>
        </div>

        <div class="profile-picture">
            <img
                src="https://th.bing.com/th/id/OIP.GBWUQUx938jBExN0d59O6gHaHn?w=197&h=203&c=7&r=0&o=7&dpr=1.3&pid=1.7&rm=3"
                alt="Foto Profil"
            >
        </div>

        <h2>DYO ANGGARA DAKSANA PRAYUGO</h2>

        <div class="status">Mahasiswa</div>

        <div class="profile-info">

            <div class="info-box">
                <div class="info-icon"><img src="https://cdn-icons-png.flaticon.com/128/9512/9512601.png" alt="NIM"></div>
                <div>
                    <small>NIM</small>
                    <p>252410102109</p>
                </div>
            </div>

            <div class="info-box">
                <div class="info-icon"><img src="https://cdn-icons-png.flaticon.com/128/893/893257.png" alt="Email"></div>
                <div>
                    <small>Email</small>
                    <p>email.com</p>
                </div>
            </div>

            <div class="info-box">
                <div class="info-icon"><img src="https://cdn-icons-png.flaticon.com/128/18207/18207348.png" alt="PRODI"></div>
                <div>
                    <small>Program Studi</small>
                    <p>Teknologi Informasi</p>
                </div>
            </div>

        </div>

        <button class="logout">LOGOUT</button>

    </aside>

    <script src="script.js"></script>

</body>
</html>
